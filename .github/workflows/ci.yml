name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test
        working-directory: backend
        run: ./mvnw -B -ntp test
      - name: Build the standalone CLI
        working-directory: backend
        run: ./mvnw -B -ntp -P cli -DskipTests package
      - uses: actions/upload-artifact@v4
        with:
          name: changelens-cli
          path: backend/target/changelens-cli.jar
