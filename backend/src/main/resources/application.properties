spring.application.name=backend

# Repositories the API may analyse: one sub-folder per repository. Requests name a folder, never a path.
changelens.workspace=${CHANGELENS_WORKSPACE:./workspace}
changelens.workers=2
changelens.queue=20

# Analyses are stored in a local H2 file by default. Point these at PostgreSQL for a shared deployment.
spring.datasource.url=${CHANGELENS_DB_URL:jdbc:h2:file:./data/changelens}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
